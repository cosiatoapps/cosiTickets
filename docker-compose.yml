services:
  # ---------------------------------------------------------------------------
  # 1. Backend API (FastAPI + Python 3.11/3.12)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./cositickets-api
      dockerfile: Dockerfile
    container_name: cositickets_api
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./cositickets-api:/app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: ${ENVIRONMENT}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_PRIMARY_IMAGE_MODEL: ${GEMINI_PRIMARY_IMAGE_MODEL}
      GEMINI_FALLBACK_MODEL_1: ${GEMINI_FALLBACK_MODEL_1}
      GEMINI_FALLBACK_MODEL_2: ${GEMINI_FALLBACK_MODEL_2}
      GEMINI_FALLBACK_MODEL_3: ${GEMINI_FALLBACK_MODEL_3}
      IMAGE_GEN_MAX_RETRIES_PER_MODEL: ${IMAGE_GEN_MAX_RETRIES_PER_MODEL}
      IMAGE_GEN_RETRY_DELAY_SECONDS: ${IMAGE_GEN_RETRY_DELAY_SECONDS}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cositickets_network

  # ---------------------------------------------------------------------------
  # 2. Frontend Web UI (React + Vite + Nginx)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./cositickets-ui
      dockerfile: Dockerfile
    container_name: cositickets_ui
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - cositickets_network

networks:
  cositickets_network:
    name: cositickets_network
    driver: bridge